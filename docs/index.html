<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Archive – Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        h1 { color: #58a6ff; border-bottom: 2px solid #30363d; padding-bottom: 10px; }
        h2 { color: #f0f6fc; margin: 20px 0 10px 0; }
        .stats { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0; }
        .stat-box { background: #161b22; padding: 15px 25px; border-radius: 8px; border: 1px solid #30363d; flex: 1; min-width: 120px; text-align: center; }
        .stat-box .number { font-size: 2em; font-weight: bold; color: #58a6ff; }
        .stat-box .label { color: #8b949e; font-size: 0.9em; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #161b22; border: 1px solid #30363d; border-radius: 5px; color: #c9d1d9; font-size: 16px; }
        .table-wrapper { max-height: 70vh; overflow-y: auto; border: 1px solid #30363d; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #161b22; text-align: left; padding: 10px; border-bottom: 2px solid #30363d; color: #f0f6fc; position: sticky; top: 0; z-index: 10; }
        td { padding: 10px; border-bottom: 1px solid #21262d; }
        tr:hover { background: #161b22; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .badge-phone { background: #2ea043; color: white; }
        .badge-url { background: #8b5cf6; color: white; }
        .badge-social { background: #1f6feb; color: white; }
        .badge-email { background: #d29922; color: white; }
        .badge-address { background: #f0883e; color: white; }
        .footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #21262d; color: #8b949e; font-size: 0.9em; text-align: center; }
        .load-more-btn { background: #1f6feb; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin: 20px auto; display: block; font-size: 16px; }
        .load-more-btn:hover { background: #388bfd; }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>📊 Data Archive – Dashboard</h1>
    <p style="color:#8b949e;">Real data from GitHub • Government websites • Social media</p>

    <div class="stats" id="stats">
        <div class="stat-box"><div class="number" id="total">Loading...</div><div class="label">Total Matches</div></div>
        <div class="stat-box"><div class="number" id="phones">-</div><div class="label">Phones</div></div>
        <div class="stat-box"><div class="number" id="urls">-</div><div class="label">URLs</div></div>
        <div class="stat-box"><div class="number" id="social">-</div><div class="label">Social</div></div>
        <div class="stat-box"><div class="number" id="emails">-</div><div class="label">Emails</div></div>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Search all data..." onkeyup="filterData()">

    <div id="dataContainer">
        <h2>📋 Extracted Data</h2>
        <div id="loading">Loading data...</div>
        <div class="table-wrapper" id="tableWrapper">
            <table id="dataTable" style="display:none;">
                <thead><tr><th>Type</th><th>Value</th><th>Source</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load More (50)</button>
    </div>

    <div class="footer">
        🔒 Private Repository • Data for personal research only
    </div>

    <script>
        let allData = [];
        let displayCount = 50;
        const batchSize = 50;

        function loadData() {
            fetch('data/data.json')
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.json();
                })
                .then(data => {
                    allData = data;
                    renderAll();
                })
                .catch(error => {
                    document.getElementById('loading').textContent = '❌ Failed to load data: ' + error;
                    console.error('Error:', error);
                });
        }

        function renderAll() {
            const phones = allData.filter(d => d.type === 'phone');
            const urls = allData.filter(d => d.type === 'url');
            const social = allData.filter(d => d.type === 'social');
            const emails = allData.filter(d => d.type === 'email');

            document.getElementById('total').textContent = allData.length;
            document.getElementById('phones').textContent = phones.length;
            document.getElementById('urls').textContent = urls.length;
            document.getElementById('social').textContent = social.length;
            document.getElementById('emails').textContent = emails.length;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
            renderTable(allData.slice(0, displayCount));
            document.getElementById('loadMoreBtn').style.display = displayCount < allData.length ? 'block' : 'none';
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                const badgeClass = `badge-${item.type}`;
                tr.innerHTML = `
                    <td><span class="badge ${badgeClass}">${item.type}</span></td>
                    <td>${escapeHtml(item.value || '')}</td>
                    <td>${escapeHtml(item.source || '')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function loadMore() {
            displayCount += batchSize;
            if (displayCount > allData.length) displayCount = allData.length;
            renderTable(allData.slice(0, displayCount));
            if (displayCount >= allData.length) {
                document.getElementById('loadMoreBtn').style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                displayCount = 50;
                renderTable(allData.slice(0, displayCount));
                document.getElementById('loadMoreBtn').style.display = displayCount < allData.length ? 'block' : 'none';
                return;
            }
            const filtered = allData.filter(item =>
                (item.type || '').toLowerCase().includes(query) ||
                (item.value || '').toLowerCase().includes(query) ||
                (item.source || '').toLowerCase().includes(query)
            );
            renderTable(filtered);
            document.getElementById('loadMoreBtn').style.display = 'none';
        }

        // Start
        loadData();
    </script>
</body>
</html>
