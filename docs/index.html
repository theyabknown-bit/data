<!DOCTYPE html>
<html>
<head><title>DataHarvester Dashboard</title>
<style>
body { background: #0a0a0f; color: #e0e0e0; font-family: monospace; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #00ff88; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
.card { background: #1a1a2e; padding: 20px; border-radius: 10px; border: 1px solid #333; }
.number { font-size: 2.5em; color: #00ff88; }
.label { color: #666; font-size: 0.9em; }
.updated { color: #444; font-size: 0.8em; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
<h1>📊 DataHarvester Dashboard</h1>
<div class="stats">
<div class="card"><div class="number">2,577</div><div class="label">Total Matches</div></div>
<div class="card"><div class="number">126</div><div class="label">Phones</div></div>
<div class="card"><div class="number">126</div><div class="label">URLs</div></div>
<div class="card"><div class="number">12</div><div class="label">Emails</div></div>
</div>
<div class="card"><h3>🏥 Medical Data</h3><div class="number">2,384</div><div class="label">Medical Records</div></div>
<p class="updated">Updated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')</p>
</div>
</body>
</html>
